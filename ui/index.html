<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV Graph Explorer — Data In, Answers Out</title>
  <meta name="description" content="Upload any CSV and instantly chat with your data via a Neo4j graph database." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ─── HEADER ─── -->
  <header class="header">
    <div class="header-brand">
      <span class="logo">⬡</span>
      <span class="brand-name">CSV Graph Explorer</span>
    </div>
    <div class="header-meta">
      <span id="health-badge" class="badge badge-checking">⏳ Connecting...</span>
      <a href="http://localhost:7474" target="_blank" class="neo4j-link">Neo4j Browser ↗</a>
    </div>
  </header>

  <main class="main">

    <!-- ─── STEP 1: UPLOAD ─── -->
    <section class="card" id="upload-card">
      <div class="card-header">
        <span class="step-num">01</span>
        <h2>Upload CSV</h2>
      </div>

      <div id="drop-zone" class="drop-zone" role="button" tabindex="0"
           aria-label="Drop CSV here or click to browse">
        <div class="drop-icon">📂</div>
        <p class="drop-title">Drag &amp; drop your CSV here</p>
        <p class="drop-sub">or <label for="file-input" class="browse-label">browse files</label></p>
        <input type="file" id="file-input" accept=".csv" hidden />
      </div>

      <div id="upload-error" class="error-msg" hidden></div>

      <!-- Progress -->
      <div id="progress-section" class="progress-section" hidden>
        <div class="progress-header">
          <span id="progress-filename" class="progress-filename"></span>
          <span id="progress-status" class="progress-status">Queued</span>
        </div>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar" style="width:0%"></div>
        </div>
        <div class="progress-counts">
          <span id="progress-label">0 / 0 rows</span>
          <span id="progress-failed" class="failed-count"></span>
        </div>
      </div>
    </section>

    <!-- ─── STEP 2: SCHEMA PREVIEW ─── -->
    <section class="card" id="schema-card" hidden>
      <div class="card-header">
        <span class="step-num">02</span>
        <h2>Schema Discovered</h2>
      </div>
      <div id="schema-columns" class="chip-list"></div>
      <p class="schema-hint">Graph: <code>(:Dataset)-[:HAS_ROW]->(:Row)</code></p>
    </section>

    <!-- ─── STEP 3: CHAT ─── -->
    <section class="card" id="chat-card" hidden>
      <div class="card-header">
        <span class="step-num">03</span>
        <h2>Ask Your Data</h2>
      </div>

      <!-- Suggested questions -->
      <div id="suggestions" class="suggestions"></div>

      <!-- Chat messages -->
      <div id="chat-messages" class="chat-messages" aria-live="polite"></div>

      <!-- Input row -->
      <div class="chat-input-row">
        <input type="text" id="chat-input"
               class="chat-input"
               placeholder="How many rows where status = Active?"
               autocomplete="off"
               aria-label="Type your question" />
        <button id="send-btn" class="btn btn-primary" aria-label="Send">
          Ask ↵
        </button>
      </div>
    </section>

  </main>

  <footer class="footer">
    RISE @ RST #5 — Data In, Answers Out &nbsp;·&nbsp; All data stays local
  </footer>

  <script src="app.js"></script>
</body>
</html>
